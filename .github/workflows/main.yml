name: Auto PR with Copilot

on:
  push:
    branches-ignore:
      - main  # Evita que se dispare cuando trabajas directo en main

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 1️⃣ Descargar el repositorio con historial completo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2️⃣ Configurar identidad de Git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3️⃣ Sincronizar cualquier cambio pendiente en el runner
      - name: Commit and Push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "AUTO: Actualización de archivos desde Action"
            git push origin HEAD
          else
            echo "Sin cambios locales adicionales para subir."
          fi

      # 4️⃣ Generar descripción analizando diferencias reales
      - name: Generate PR Body
        id: pr_info
        run: |
          # Asegurar que conocemos la rama main para comparar
          git fetch origin main --quiet

          # Obtener estadísticas de archivos y resumen de commits
          CHANGES=$(git diff origin/main...HEAD --stat)
          COMMITS=$(git log origin/main..HEAD --oneline)
          
          if [ -z "$CHANGES" ]; then
            CHANGES="No se detectaron cambios visuales (la rama podría estar ya sincronizada)."
          fi

          # Construir el cuerpo del PR
          echo "pr_body<<EOF" >> $GITHUB_OUTPUT
          echo "## 🤖 Análisis Automático de Cambios" >> $GITHUB_OUTPUT
          echo "He revisado los commits en esta rama y esto es lo que encontré:" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 📝 Commits incluidos:" >> $GITHUB_OUTPUT
          echo "\`\`\`text" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "\`\`\`" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 📊 Archivos modificados:" >> $GITHUB_OUTPUT
          echo "\`\`\`text" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "\`\`\`" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 5️⃣ Crear el Pull Request (Solo si no existe ya uno)
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=${GITHUB_REF_NAME}
          
          # Verificar si ya existe un PR abierto para esta rama
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --title "🚀 Auto PR: $BRANCH_NAME" \
              --body "${{ steps.pr_info.outputs.pr_body }}" \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "El PR ya existe (#$PR_EXISTS). Actualizando información..."
            gh pr edit "$PR_EXISTS" --body "${{ steps.pr_info.outputs.pr_body }}"
          fi
