name: Auto PR with Copilot

on:
  push:
    branches-ignore:
      - main  # No queremos que se dispare cuando pusheamos a la rama principal

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 1️⃣ Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Importante para que pueda ver el historial y comparar

      # 2️⃣ Configurar Git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3️⃣ Commit y Push con Token de Seguridad
      - name: Commit and Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          # Solo commitea si hay cambios reales para evitar errores
          if ! git diff --cached --quiet; then
            git commit -m "AUTO: cambios detectados en ${GITHUB_REF_NAME}"
            git push origin HEAD
          else
            echo "No hay cambios pendientes para commitear."
          fi

      # 4️⃣ Generar descripción (Simulación de Copilot CLI)
      # Nota: Copilot CLI requiere autenticación especial en Actions. 
      # Usamos un resumen de git diff como base.
      - name: Generate PR Body
        id: copilot
        run: |
          DIFF=$(git diff origin/main..HEAD --stat)
          BODY="## Cambios detectados automáticamente por Copilot 🤖%0A%0A\`\`\`%0A$DIFF%0A\`\`\`"
          echo "pr_body=$BODY" >> $GITHUB_OUTPUT

      # 5️⃣ Crear el Pull Request usando GitHub CLI (gh)
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=${GITHUB_REF_NAME}
          
          # Verificar si ya existe un PR para no duplicar
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --title "AUTO: $BRANCH_NAME" \
              --body "${{ steps.copilot.outputs.pr_body }}" \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "El Pull Request ya existe, saltando creación."
          fi
