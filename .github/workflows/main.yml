name: Auto PR with Copilot

on:
  push:
    branches-ignore:
      - main

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 1️⃣ Descargar el repo con todo su historial
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2️⃣ Configurar Git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3️⃣ Sincronizar cambios (si los hay)
      - name: Commit and Push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "AUTO: Actualización de archivos"
            git push origin HEAD
          else
            echo "Sin cambios nuevos para subir."
          fi

      # 4️⃣ Generar descripción (Simulando lógica de Copilot)
      - name: Generate PR Body
        id: pr_info
        run: |
          # Obtenemos la lista de archivos modificados respecto a main
          CHANGES=$(git diff origin/main...HEAD --stat)
          
          echo "pr_body<<EOF" >> $GITHUB_OUTPUT
          echo "## 🤖 PR Generado Automáticamente" >> $GITHUB_OUTPUT
          echo "He analizado tus cambios respecto a la rama **main**:" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "\`\`\`text" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "\`\`\`" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 5️⃣ Crear el Pull Request (Solo si no existe uno)
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=${GITHUB_REF_NAME}
          
          # Verificar si el PR ya existe
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --title "🚀 Auto PR: $BRANCH_NAME" \
              --body "${{ steps.pr_info.outputs.pr_body }}" \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "El PR ya existe (#$PR_EXISTS). No se crea uno nuevo."
          fi
